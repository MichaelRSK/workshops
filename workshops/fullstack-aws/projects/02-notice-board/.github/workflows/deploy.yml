name: Deploy Notice Board

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        working-directory: projects/02-notice-board
        run: python build.py

      - name: Deploy Lambda zip
        working-directory: projects/02-notice-board
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://backend/lambda.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/02-notice-board/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: projects/02-notice-board/frontend
        run: npm ci

      - name: Build frontend
        working-directory: projects/02-notice-board/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Upload frontend to S3
        working-directory: projects/02-notice-board/frontend
        run: aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DIST_ID="$CLOUDFRONT_DISTRIBUTION_ID"

          if [ -z "$DIST_ID" ]; then
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(join(',', Origins.Items[].DomainName), '${S3_BUCKET}')].Id | [0]" \
              --output text)
          fi

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Could not find CloudFront distribution for bucket ${S3_BUCKET}"
            exit 1
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
